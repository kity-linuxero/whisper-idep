<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Transcriptor IDEP</title>
<link rel="icon" href="img/idep-informatica.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a class="header__brand" href="https://www.idepba.com.ar/idep-informatica/" target="_blank" rel="noopener noreferrer">
        <img src="img/idep-informatica.png" alt="IDEP Informática" width="36" height="36">
        <div class="header__titles">
          <h1>Transcriptor de audio</h1>
          <p class="header__subtitle">IDEP Informática · transcripción en español</p>
        </div>
      </a>
      <button type="button" id="btnTheme" class="icon-btn icon-btn--theme" aria-label="Cambiar tema" title="Cambiar tema">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <div class="card">
      <h2>Nueva transcripción</h2>

      <label class="dropzone" for="audiofile" id="dropzone">
        <svg width="28" height="28" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"></path><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
        <div class="dropzone__text">Arrastrá un archivo o hacé clic para elegirlo</div>
        <div class="dropzone__filename" id="fileName"></div>
        <input class="sr-only" type="file" id="audiofile" accept="audio/*,video/*">
      </label>
      <p class="hint">mp3, wav, m4a, aac, ogg, video con audio — se convierte solo.</p>

      <label for="model">Modelo</label>
      <select id="model">
        <option value="small" selected>Rápido (small) — ~3x tiempo real</option>
        <option value="medium">Preciso (medium) — ~5x más lento, mejor en cruces de voces</option>
      </select>

      <button id="btnSend">Transcribir</button>

      <div class="progress-wrap" id="uploadWrap" style="display:none;">
        <div class="progress-label"><span>Subiendo</span><span id="uploadPct">0%</span></div>
        <div class="progress-bar"><div id="uploadBar" style="width:0%"></div></div>
      </div>

      <div class="progress-wrap" id="processWrap" style="display:none;">
        <div class="progress-label"><span id="processLabel">Procesando</span><span id="processPct">0%</span></div>
        <div class="progress-bar" id="processBar"><div id="processBarInner" style="width:0%"></div></div>
        <div class="stall-hint" id="stallHint"></div>
        <button id="btnCancel" class="btn-danger" type="button">Cancelar</button>
      </div>

      <div class="error" id="errorMsg" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5M12 16h.01"></path></svg>
        <span id="errorMsgText"></span>
      </div>
      <div id="resultMeta" class="meta-row" style="display:none;"></div>
      <div id="result"></div>
      <div id="downloadActions" class="download-actions" style="display:none;">
        <div class="actions-row">
          <a class="action" id="downloadTxt" href="#">
            <svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 16l-4-4M12 16l4-4"></path><path d="M4 18v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
            Descargar .txt
          </a>
          <a class="action" id="downloadJson" href="#">
            <svg width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 16l-4-4M12 16l4-4"></path><path d="M4 18v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
            Descargar .json
          </a>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card__header">
        <h2>Historial</h2>
        <button type="button" id="btnRefreshHistory" class="btn-link">Actualizar</button>
      </div>
      <table>
        <thead>
          <tr><th>Archivo</th><th>Modelo</th><th>Duración</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </main>

  <footer class="footer">
    <a class="footer__brand" href="https://www.idepba.com.ar/idep-informatica/" target="_blank" rel="noopener noreferrer">
      <img src="img/idep-informatica.png" alt="IDEP Informática" width="36" height="36">
      <span>Desarrollado por <strong>IDEP</strong></span>
    </a>
  </footer>

<script src="app.js"></script>
</body>
</html>
